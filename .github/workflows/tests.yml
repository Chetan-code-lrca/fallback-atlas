name: Prototype tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install frontend dependencies from lockfile
        run: npm ci --no-audit --no-fund
      - name: Install API dependencies from lockfile
        run: npm ci --prefix api --no-audit --no-fund
      - name: Run frontend tests
        run: npm test -- --watchAll=false --runInBand
      - name: Build production frontend
        run: npm run build
      - name: Run Azure Functions API tests
        run: npm --prefix api test
