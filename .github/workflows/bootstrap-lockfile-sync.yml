name: Temporary npm lockfile sync

on:
  push:
    branches:
      - fix/wifi-observation-source-label
    paths:
      - ".github/workflows/bootstrap-lockfile-sync.yml"

permissions:
  contents: write

jobs:
  sync-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/wifi-observation-source-label

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate root lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify API lockfile
        run: npm install --package-lock-only --prefix api --ignore-scripts --no-audit --no-fund

      - name: Commit aligned lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json api/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes were generated."
            exit 1
          fi
          git commit -m "chore(deps): align frontend and API lockfiles"
          git push origin HEAD:fix/wifi-observation-source-label
