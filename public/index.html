<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12283a" />
    <meta name="description" content="Fallback Atlas helps communities share local reports about mobile data, broadband and power availability." />
    <meta property="og:title" content="Fallback Atlas — Know what still works" />
    <meta property="og:description" content="A community-powered view of local infrastructure status. Prototype data is clearly labelled." />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <script src="%PUBLIC_URL%/geocoder-config.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.15.0/dist/maplibre-gl.css" />
    <script type="module">
      try {
        const maplibreModule = await import('https://unpkg.com/maplibre-gl@6.15.0/dist/maplibre-gl.mjs');
        window.maplibregl = maplibreModule;
        window.__MAPLIBRE_LOAD_STATE = 'ready';
        window.dispatchEvent(new Event('maplibre-ready'));
      } catch (error) {
        window.__MAPLIBRE_LOAD_STATE = 'error';
        window.dispatchEvent(new Event('maplibre-failed'));
      }
    </script>
    <title>Fallback Atlas — Know what still works</title>
  </head>
  <body>
    <noscript>This app needs JavaScript enabled to run.</noscript>
    <div id="root"></div>
  </body>
</html>
